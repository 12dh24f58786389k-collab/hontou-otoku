<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172d29"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="本当にお得？"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>本当にお得？</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#182824;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}header{background:#172d29;color:white;padding:24px 18px 20px}h1{margin:0;font-size:25px}header p{margin:6px 0 0;font-size:13px;color:#d5e3db}main{max-width:650px;margin:auto;padding:16px 14px 70px}.panel{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #14271b0a}h2{font-size:17px;margin:0 0 13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}input,select{width:100%;font-size:16px;border:1px solid #d6dfd9;border-radius:9px;padding:11px;background:#fff;color:#172d29}button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#176a4d;color:#fff;width:100%;margin-top:12px}.secondary{background:#e9f1eb;color:#185a42}.danger{background:#fff0ed;color:#a43a2c}.muted{color:#65756c;font-size:12px}.item{border:1px solid #dce7df;border-radius:12px;padding:12px;margin:10px 0}.item.best{border:2px solid #168257;background:#f0faf3}.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.price{font-size:21px;font-weight:800;margin:8px 0}.tag{background:#176a4d;color:#fff;border-radius:100px;padding:4px 9px;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.history{border-top:1px solid #e2e8e3;padding:12px 0}.empty{text-align:center;color:#7b887e;padding:18px 0}.notice{font-size:12px;line-height:1.7;color:#596a60}#message{font-size:13px;color:#a43a2c;margin-top:8px}</style></head><body><header><h1>本当にお得？</h1><p>容量も割引もそろえて、賢く比べよう。</p></header><main><section class="panel"><h2>商品を追加</h2><form id="form"><div class="fields"><div class="wide"><label for="name">商品名</label><input id="name" maxlength="80" placeholder="例：お米 A" required></div><div><label for="price">税込価格（円）</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="2980"></div><div><label for="qty">内容量・個数</label><input id="qty" type="number" min="0.000001" step="any" inputmode="decimal" required placeholder="2000"></div><div><label for="unit">単位</label><select id="unit"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">L</option><option value="個">個</option></select></div><div><label for="discountType">割引方法</label><select id="discountType"><option value="none">割引なし</option><option value="percent">％引き</option><option value="yen">円引き</option></select></div><div class="wide" id="discountWrap" hidden><label id="discountLabel" for="discount">割引値</label><input id="discount" type="number" min="0" step="any" inputmode="decimal" value="0"></div></div><p id="message" role="alert"></p><button class="primary" type="submit">＋ 商品を追加する</button></form></section><section class="panel"><h2>比較結果 <span class="muted" id="count"></span></h2><p class="muted">同じ種類（重さ・容量・個数）の商品同士で最安判定します。</p><div id="results" aria-live="polite"></div><div class="actions"><button class="secondary" id="save" type="button">比較を履歴に保存</button><button class="danger" id="clear" type="button">比較をクリア</button></div></section><section class="panel"><h2>比較履歴</h2><div id="histories"></div></section><p class="notice">価格は税込で入力してください。％引きと円引きは商品ごとにどちらか一方を適用します。履歴はこの端末のブラウザ内に保存され、閲覧データ削除などで消える場合があります。通信・ログイン・有料AI APIは不要です。</p></main><script src="app.js" defer></script></body></html>
