<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143b32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="本当にお得？"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>本当にお得？ Ver.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#19332c;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}header{background:#143b32;color:#fff;padding:24px 18px 22px}header>div{max-width:680px;margin:auto}h1{font-size:26px;margin:0}header p{font-size:13px;color:#d7e8df;margin:7px 0 0}.version{font-size:11px;background:#2a6953;padding:4px 9px;border-radius:20px;vertical-align:middle}main{max-width:680px;margin:auto;padding:15px 12px 60px}.panel{background:white;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 3px 16px #16392b0b}h2{font-size:18px;margin:0 0 12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select{width:100%;font-size:16px;border:1px solid #cddbd2;border-radius:11px;padding:12px 10px;color:#19332c;background:white;min-width:0}input:focus,select:focus{outline:2px solid #4c9a77;outline-offset:1px}button{border:0;border-radius:11px;padding:12px 13px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px}.primary{background:#176b4c;color:#fff;width:100%;margin-top:13px}.secondary{background:#e6f1e9;color:#145c43}.danger{background:#fff0ed;color:#a43a2c}.muted{color:#60776b;font-size:12px;line-height:1.6}.item{border:1px solid #d9e7dd;border-radius:13px;padding:13px;margin:10px 0}.item.best{border:2px solid #168257;background:#f1faf4}.item-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.item-head strong{overflow-wrap:anywhere}.price{font-size:23px;font-weight:800;margin:7px 0}.tag{background:#176b4c;color:white;border-radius:99px;padding:5px 9px;font-size:11px;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.history{border-top:1px solid #e1e9e3;padding:12px 0}.empty{text-align:center;color:#718477;padding:16px}.notice{font-size:12px;line-height:1.8;color:#5a7063}.error{font-size:13px;color:#b12e24;margin-top:9px}.winner{background:#eaf7ee;border:1px solid #b7ddc4;border-radius:13px;padding:13px;margin:10px 0}.winner strong{font-size:17px}.preview{background:#f4f8f5;border-radius:10px;padding:11px;margin-top:12px}.preview b{font-size:19px}.mini{font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-head button{font-size:12px;padding:8px 10px;min-height:34px}.pill{display:inline-block;background:#eef3ef;border-radius:99px;padding:4px 8px;font-size:12px;margin-top:7px}.hidden{display:none!important}
</style></head><body><header><div><h1>本当にお得？ <span class="version">Ver.2</span></h1><p>値札の数字だけじゃない。本当に安い方を見つけよう。</p></div></header><main>
<section class="panel"><h2 id="formTitle">商品を追加</h2><form id="form"><div class="fields"><div class="wide"><label for="name">商品名</label><input id="name" maxlength="80" placeholder="例：お米A" required></div><div><label for="price">表示価格（円）</label><input id="price" type="number" min="0" step="any" inputmode="decimal" placeholder="2980" required></div><div><label for="tax">価格の種類</label><select id="tax"><option value="included">税込</option><option value="excluded8">税抜・8％</option><option value="excluded10">税抜・10％</option></select></div><div><label for="qty">1パックの内容量</label><input id="qty" type="number" min="0.000001" step="any" inputmode="decimal" placeholder="500" required></div><div><label for="unit">単位</label><select id="unit"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">L</option><option value="個">個</option></select></div><div><label for="packs">セット数（袋・本など）</label><input id="packs" type="number" min="1" step="1" inputmode="numeric" value="1" required></div><div><label for="discountType">割引方法</label><select id="discountType"><option value="none">割引なし</option><option value="percent">％引き</option><option value="yen">円引き</option></select></div><div id="discountWrap" class="wide" hidden><label id="discountLabel" for="discount">割引値</label><input id="discount" type="number" min="0" step="any" inputmode="decimal" value="0"></div></div><div class="preview" id="preview" aria-live="polite">価格と内容量を入力すると、単価を表示します。</div><div class="error" id="message" role="alert"></div><button class="primary" id="submitBtn" type="submit">＋ 商品を追加</button><button class="secondary hidden" id="cancelEdit" type="button" style="width:100%;margin-top:8px">編集をやめる</button></form></section>
<section class="panel"><div class="section-head"><h2>比較結果 <span class="muted" id="count"></span></h2></div><p class="muted">重さ・容量・個数の種類ごとに比較します。税込の割引後単価で判定。</p><div id="winners"></div><div id="results" aria-live="polite"></div><div class="actions"><button class="secondary" id="save" type="button">比較を履歴に保存</button><button class="danger" id="clear" type="button">比較をクリア</button></div></section>
<section class="panel"><div class="section-head"><h2>比較履歴</h2><button class="secondary" id="export" type="button">履歴をバックアップ</button></div><div id="histories"></div></section>
<p class="notice">※ 税率は入力した商品に合わせて選択してください。税額・割引後価格は円単位に四捨五入して計算します。％引きと円引きはどちらか一方を適用します。端末内保存のため、ブラウザデータ削除などで履歴が消える場合があります。旧Ver.1の保存データをそのまま利用します。広告・ログイン・有料AI APIはありません。</p></main><script src="app.js" defer></script></body></html>
